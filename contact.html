<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — REKOM™</title>
  <meta name="description" content="Any doubt, collab or order issue? Drop REKOM™ a message.">
  <meta name="author" content="REKOM™">
  <meta name="theme-color" content="#050507">
  <meta name="robots" content="index, follow">

  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="contact">
<main>
  
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span>/</span> <span aria-current="page">Contact</span></nav>
      <span class="eyebrow mt-3">Talk to us</span>
      <h1 data-split><span class="split-line"><span>Say</span></span><span class="split-line"><span><span class="outline-text">hi.</span></span></span></h1>
      <p class="lead reveal">Any doubt, collab or order issue? Drop us a message — a real human from the workshop answers every one.</p>
    </div>
    <div class="ghost" aria-hidden="true">HELLO</div>
  </section>
  <section class="section">
    <div class="container contact-layout">
      <div class="contact-info reveal">
        <div class="contact-item">
          <span class="label">Email</span>
          <a class="big" href="mailto:rekomwear@gmail.com">rekomwear@gmail.com</a>
        </div>
        <div class="contact-item">
          <span class="label">Phone</span>
          <a class="big" href="tel:+34977207089">+34 977 207 089</a>
        </div>
        <div class="contact-item">
          <span class="label">Studio</span>
          <span class="big">Carrer del Duc, 7<br>08002 Barcelona</span>
          <span class="muted">Mon–Sat · 11:00–21:00</span>
        </div>
        <div class="contact-item" style="border:0">
          <span class="label">Follow</span>
          <div class="socials" style="margin-left:-10px">
            <a class="icon-btn" href="https://www.instagram.com/rekom_wear/" target="_blank" rel="noopener" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a class="icon-btn" href="https://www.tiktok.com/@rekom_wear" target="_blank" rel="noopener" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
            <a class="icon-btn" href="https://x.com/RekomWear" target="_blank" rel="noopener" aria-label="X (Twitter)"><i class="bi bi-twitter-x"></i></a>
            <a class="icon-btn" href="https://www.youtube.com/@Rekom_Wear" target="_blank" rel="noopener" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
          </div>
        </div>
      </div>

      <div class="card glow reveal reveal-d1">
        <form class="form-grid" data-demo data-success-title="Message sent." data-success="Thanks for reaching out. We usually answer within 24–48 hours.">
          <div class="field">
            <label for="name">Name</label>
            <input class="input" type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@mail.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone (optional)</label>
            <input class="input" type="tel" id="phone" name="phone" placeholder="+34 600 000 000" autocomplete="tel">
          </div>
          <div class="field">
            <label for="topic">Topic</label>
            <select class="select" id="topic" name="topic">
              <option>Order question</option>
              <option>Sizing help</option>
              <option>Collab / press</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="field full">
            <label for="message">Message</label>
            <textarea class="textarea" id="message" name="message" placeholder="Write your message..." required></textarea>
          </div>
          <div class="full">
            <button class="btn btn-lg btn-block" type="submit">Send message <i class="bi bi-send"></i></button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
