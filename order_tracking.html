<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Tracking — REKOM™</title>
  <meta name="description" content="Check the status of your REKOM™ order.">
  <meta name="author" content="REKOM™">
  <meta name="theme-color" content="#050507">
  <meta name="robots" content="index, follow">

  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="tracking">
<main>
  
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span>/</span> <span aria-current="page">Order tracking</span></nav>
      <span class="eyebrow mt-3">Where is my hoodie?</span>
      <h1 data-split><span class="split-line"><span>Order</span></span><span class="split-line"><span><span class="outline-text">tracking.</span></span></span></h1>
      <p class="lead reveal">Enter your order number and the email used at checkout. You will find both in your confirmation.</p>
    </div>
    <div class="ghost" aria-hidden="true">TRACK</div>
  </section>
  <section class="section-tight">
    <div class="container" style="max-width:760px">
      <div class="card glow reveal">
        <form class="form-grid" id="track-form" novalidate>
          <div class="field">
            <label for="track-number">Order number</label>
            <input class="input" id="track-number" name="order_number" placeholder="REK-12345" required>
          </div>
          <div class="field">
            <label for="track-email">Email</label>
            <input class="input" id="track-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="full">
            <button class="btn btn-lg btn-block" type="submit">Track order <i class="bi bi-arrow-right"></i></button>
          </div>
        </form>
        <div id="track-result" aria-live="polite"></div>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/tracking.js"></script>
</body>
</html>
